<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AZ-900 Study Planner</title>
  <meta name="description" content="A personal study planner for the Microsoft Azure Fundamentals (AZ-900) exam." />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>
 
  <header class="topbar">
    <div class="topbar-inner">
      <button class="brand" data-act="nav" data-to="dashboard" aria-label="Go to dashboard">
        <span class="logo">☁️</span>
        <span class="brand-text"><b>AZ-900</b> Study Planner</span>
      </button>
 
      <nav class="nav" id="nav" aria-label="Main">
        <button data-act="nav" data-to="dashboard">Dashboard</button>
        <button data-act="nav" data-to="plan">Study plan</button>
        <button data-act="nav" data-to="learn">Learn</button>
        <button data-act="nav" data-to="practice">Practice</button>
      </nav>
 
      <div class="top-stats">
        <div class="chip" id="chip-level" title="Your level"></div>
        <div class="chip" id="chip-streak" title="Study streak"></div>
        <button class="icon-btn" data-act="theme" aria-label="Toggle dark mode" title="Toggle dark mode">🌓</button>
      </div>
    </div>
  </header>
 
  <main id="view" class="view" tabindex="-1"></main>
 
  <footer class="footer">
    Built for AZ-900 revision · Practice questions are original and aligned to the skills outline ·
    Always confirm details on <a href="https://learn.microsoft.com/en-us/credentials/certifications/azure-fundamentals/" target="_blank" rel="noopener">Microsoft Learn</a>.
  </footer>
 
  <div id="toasts" aria-live="polite"></div>
 
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
